name: Render Free Backend Keep-Alive

on:
  schedule:
    # Run every 14 minutes to prevent Render free instance from sleeping
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Check
        run: |
          BACKEND_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            echo "⚠️ RENDER_BACKEND_URL secret not set. Skipping keep-alive ping."
            echo "💡 Add RENDER_BACKEND_URL (e.g. https://your-backend.onrender.com) to your GitHub Repository Secrets."
          else
            echo "📡 Pinging $BACKEND_URL/api/health..."
            curl -s -f "$BACKEND_URL/api/health" || echo "Ping failed or server waking up"
          fi
