# ========================================================
# Render Blueprint - Welfare Management System Backend
# ========================================================
# Docs: https://render.com/docs/blueprint-spec

version: "1"

services:
  - type: web
    name: welfare-management-backend
    runtime: node
    plan: free
    region: ohio # Co-located with Neon US-East-2 for ultra-fast <3ms database queries
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false
        # Set this to your frontend URL in the Render dashboard:
        # e.g., https://your-welfare-app.vercel.app
      - key: DATABASE_URL
        sync: false
        # Pre-configured with your Neon PostgreSQL (US-East-2):
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
